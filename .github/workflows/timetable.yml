name: Daily Timetable Sync

on:
  schedule:
    - cron: '0 4,5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bakalari-pages
  cancel-in-progress: false

jobs:
  sync_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest timetable (last, current, next week)
        env:
          TIMETABLE_LOGIN: ${{ secrets.TIMETABLE_LOGIN }}
          TIMETABLE_KEY: ${{ secrets.TIMETABLE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/fetch-timetable.mjs --allow-transient-error
          else
            node scripts/fetch-timetable.mjs
          fi

      - name: Commit updated timetable snapshot
        run: |
          if ! git diff --quiet -- data/timetable.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/timetable.json
            git commit -m "chore(data): update daily timetable snapshot"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Build production bundle
        run: npm run build

      - name: Run privacy and secret scan
        run: npm run test:privacy -- --require-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: sync_and_build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
