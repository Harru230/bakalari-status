name: Status Probe and GitHub Pages

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bakalari-pages
  cancel-in-progress: false

jobs:
  build_and_probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Probe Bakalari login and commit status update
        if: github.event_name != 'push'
        run: |
          npm run probe
          if ! git diff --quiet -- data/status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/status.json
            git commit -m "chore(data): update Bakalari status probe"
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Build production bundle
        run: npm run build

      - name: Run privacy and secret scan
        run: npm run test:privacy -- --require-dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build_and_probe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
